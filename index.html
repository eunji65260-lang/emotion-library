<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>감정 도서관</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #171426;
      font-family: Arial, "Malgun Gothic", sans-serif;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: white;
      text-align: center;
      background: #171426;
    }

    #loading h1 {
      margin: 0 0 14px;
      font-size: 30px;
      font-weight: 700;
    }

    #loading p {
      margin: 5px 0;
      opacity: 0.82;
    }

    #error {
      max-width: 330px;
      margin-top: 14px;
      color: #ffb4b4;
      font-size: 13px;
      line-height: 1.5;
      word-break: keep-all;
    }

    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 5;
      padding: 9px 12px;
      border-radius: 12px;
      color: white;
      background: rgba(24, 18, 42, 0.78);
      font-size: 13px;
      line-height: 1.5;
      pointer-events: none;
    }

    #reset {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 6;
      padding: 10px 12px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: rgba(24, 18, 42, 0.82);
      font-size: 13px;
    }

    #reset:active {
      background: rgba(110, 76, 155, 0.95);
    }

    #lookArea {
      position: fixed;
      top: 0;
      right: 0;
      width: 62%;
      height: 100%;
      z-index: 2;
      touch-action: none;
    }

    #joystickBase {
      position: fixed;
      left: 25px;
      bottom: 28px;
      z-index: 8;
      width: 130px;
      height: 130px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      touch-action: none;
    }

    #joystickKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.58);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    #tip {
      position: fixed;
      left: 25px;
      bottom: 166px;
      z-index: 5;
      color: rgba(255, 255, 255, 0.78);
      font-size: 12px;
      pointer-events: none;
    }
  </style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>
s</head>

<body>
  <div id="loading">
    <h1>감정 도서관</h1>
    <p>디지털 공간을 불러오는 중입니다.</p>
    <p id="progress">0%</p>
    <p ifd="error"></p>
  </div>

  <div id="info">
    <b>감정 도서관</b><br>
    오른쪽 드래그: 둘러보기
  </div>

  <button id="reset" type="button">처음 위치</button>

  <div id="lookArea"></div>

  <div id="tip">왼쪽 조이스틱: 이동</div>
  <div id="joystickBase">
    <div id="joystickKnob"></div>
  </div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

    import { GLTFLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js";

    import { DRACOLoader } from
      "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/DRACOLoader.js";

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171426);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.05,
      100000
    );

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    const hemisphereLight = new THREE.HemisphereLight(
      0xffffff,
      0x3b3152,
      2.2
    );
    scene.add(hemisphereLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
    mainLight.position.set(10, 20, 10);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xb9a6ff, 0.8);
    fillLight.position.set(-10, 8, -10);
    scene.add(fillLight);

    let model = null;
    let startPosition = new THREE.Vector3(0, 1.6, 0);

    let yaw = 0;
    let pitch = 0;
    let eyeHeight = 3.3;
    let walkSpeed = 0.15;

    let moveX = 0;
    let moveY = 0;

    const loading = document.getElementById("loading");
    const progress = document.getElementById("progress");
    const errorText = document.getElementById("error");

    const dracoLoader = new DRACOLoader();

    dracoLoader.setDecoderPath(
      "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/"
    );

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    loader.load(
      "./optimized2.glb",

      (gltf) => {		
        model = gltf.scene;
        scene.add(model);

        model.traverse((object) => {
          if (object.isMesh) {
            object.frustumCulled = true;

            if (object.material) {
              object.material.needsUpdate = true;
            }
          }
        });

        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        const modelHeight = Math.max(size.y, 1);

        // 모델의 크기에 맞춰 눈높이와 이동속도를 자동으로 정함
        eyeHeight =3.3;

        walkSpeed = Math.max(modelHeight * 0.004, 0.02);

        // 모델 중앙 부근의 바닥 위에서 시작
        startPosition.set(
          center.x,
          box.min.y + eyeHeight,
          center.z
        );

        camera.position.copy(startPosition);
        camera.rotation.order = "YXZ";

        progress.textContent = "완료";
        setTimeout(() => {
          loading.style.display = "none";
        }, 350);
      },

      (event) => {
        if (event.total > 0) {
          const percent = Math.round(
            (event.loaded / event.total) * 100
          );
          progress.textContent = percent + "%";
        } else {
          progress.textContent = "불러오는 중...";
        }
      },

      (error) => {
        console.error(error);
        progress.textContent = "불러오기 실패";
        errorText.textContent =
          "optimized.glb 파일을 찾지 못했습니다. 파일 이름과 위치를 확인해 주세요.";
      }
    );

    // -----------------------------
    // 가상 조이스틱
    // -----------------------------

    const joystickBase = document.getElementById("joystickBase");
    const joystickKnob = document.getElementById("joystickKnob");

    let joystickPointerId = null;

    function updateJoystick(clientX, clientY) {
      const rect = joystickBase.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const maxDistance = rect.width * 0.31;

      let dx = clientX - centerX;
      let dy = clientY - centerY;

      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance > maxDistance) {
        dx = (dx / distance) * maxDistance;
        dy = (dy / distance) * maxDistance;
      }

      joystickKnob.style.transform =
        "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px))";

      moveX = dx / maxDistance;
      moveY = -dy / maxDistance;
    }

    function resetJoystick() {
      joystickPointerId = null;
      moveX = 0;
      moveY = 0;
      joystickKnob.style.transform =
        "translate(-50%, -50%)";
    }

    joystickBase.addEventListener("pointerdown", (event) => {
      joystickPointerId = event.pointerId;
      joystickBase.setPointerCapture(event.pointerId);
      updateJoystick(event.clientX, event.clientY);
    });

    joystickBase.addEventListener("pointermove", (event) => {
      if (event.pointerId !== joystickPointerId) return;
      updateJoystick(event.clientX, event.clientY);
    });

    joystickBase.addEventListener("pointerup", resetJoystick);
    joystickBase.addEventListener("pointercancel", resetJoystick);

    // -----------------------------
    // 오른쪽 화면 드래그로 시점 회전
    // -----------------------------

    const lookArea = document.getElementById("lookArea");

    let looking = false;
    let lastX = 0;
    let lastY = 0;

    lookArea.addEventListener("pointerdown", (event) => {
      looking = true;
      lastX = event.clientX;
      lastY = event.clientY;
      lookArea.setPointerCapture(event.pointerId);
    });

    lookArea.addEventListener("pointermove", (event) => {
      if (!looking) return;

      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;

      yaw -= dx * 0.006;
      pitch -= dy * 0.004;

      pitch = THREE.MathUtils.clamp(
        pitch,
        -1.35,
        1.35
      );

      lastX = event.clientX;
      lastY = event.clientY;
    });

    lookArea.addEventListener("pointerup", () => {
      looking = false;
    });

    lookArea.addEventListener("pointercancel", () => {
      looking = false;
    });

    // -----------------------------
    // 처음 위치 버튼
    // -----------------------------

    document.getElementById("reset").addEventListener("click", () => {
      camera.position.copy(startPosition);
      yaw = 0;
      pitch = 0;
    });

    // -----------------------------
    // 이동 및 화면 출력
    // -----------------------------

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();

    function animate() {
      requestAnimationFrame(animate);

      // 카메라가 바라보는 방향 기준으로 앞/뒤 이동
      forward.set(
        Math.sin(yaw),
        0,
        -Math.cos(yaw)
      );

      right.set(
        Math.cos(yaw),
        0,
        Math.sin(yaw)
      );

      camera.position.addScaledVector(
        forward,
        moveY * walkSpeed
      );

      camera.position.addScaledVector(
        right,
        moveX * walkSpeed
      );

      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect =
        window.innerWidth / window.innerHeight;

      camera.updateProjectionMatrix();
      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    });
  </script>
</body>
</html>
